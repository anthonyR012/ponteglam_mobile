name: Continuous Integration

on:
  pull_request:
    branches:
      - test
      - main
      - release

jobs:
  CI-build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.1'

      - name: Cache Flutter dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('pubspec.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pub-
      
      - name: Install dependencies
        run: flutter pub get
      
      - name: Set up Firebase
        run: |
          printf "%s" "${{ secrets.FIREBASE_JSON }}"  > ./firebase.json
          printf "%s" "${{ secrets.FIREBASE_OPTIONS_DART }}" > ./lib/firebase_options.dart

      - name: Decode google-services.json
        run: |
          echo "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" | base64 --decode > ./android/app/google-services.json

      - name: Set up .env
        run: |
          printf "%s" "${{ secrets.ENV_PONTE }}"  > ./.env
          mkdir -p symbols   

      - name: Verify good practices
        run: flutter analyze

      - name: Run tests      
        run: flutter test

      - name: Create key.jks file and properties
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE }}" | base64 --decode > android/app/ponteglam.jks
          echo "${{ secrets.KEY_PROPERTIES }}" > android/key.properties
      
      - name: Build APK with obfuscation
        run: flutter build appbundle --release --obfuscate --split-debug-info=./symbols

      - name: Upload build Bundle
        uses: actions/upload-artifact@v4
        with:
          name: build-bundle
          path: build/app/outputs/bundle/release/app-release.aab

  CD-deploy:
    runs-on: ubuntu-latest
    needs: CI-build-and-test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Flutter dependencies
        uses: actions/download-artifact@v4
        with:
          name: build-bundle
          path: ./build-bundle
      

      - name: Deploy to Play Store
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_JSON }}
          packageName: com.antywayco.ponte_glam
          releaseFiles: ./build-bundle/app-release.aab
          track: | 
            ${{ github.event.pull_request.base.ref == 'main' && 'production' 
            || github.event.pull_request.base.ref == 'release' && 'beta' 
            || github.event.pull_request.base.ref == 'test' && 'alpha' || 'alpha' }}





          



